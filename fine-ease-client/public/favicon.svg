<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="90" height="90" x="5" y="5" rx="26" fill="url(#grad)" />
  <!-- Graph Bar/Dollar Path representing Finance -->
  <path d="M35 70V50M50 70V35M65 70V45" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="22" r="5" fill="#ffffff" />
</svg>
